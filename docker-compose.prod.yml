version: '3.8'

services:
  app:
    build: .
    container_name: albion_app
    restart: always
    ports:
      - "18000:8000"
    volumes:
      # Сохраняем базу данных и загрузки на хосте, чтобы они не терялись при перезапуске контейнера
      - ./data:/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    command: gunicorn app:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

volumes:
  data:
  uploads:
