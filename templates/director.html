<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АЛЬБИОН · Директор</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.feed-item { 
    background: var(--card); 
    border: 2px solid #cbd5e1; 
    border-radius: 12px; 
    margin-bottom: 24px; 
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    overflow: hidden;
}
.feed-item.important { border-color: #ef4444; border-width: 3px; }
.feed-header { 
    padding: 12px 16px; 
    background: #f8fafc; 
    border-bottom: 1px solid var(--border);
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}
.type-badge { 
    font-size: 11px; 
    font-weight: 700; 
    padding: 4px 10px; 
    border-radius: 999px; 
    text-transform: uppercase; 
    letter-spacing: 0.05em;
}
.type-task { background: #dbeafe; color: #1e40af; }
.type-monitoring { background: #dcfce7; color: #166534; }
.status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; }
.urg-new { background: #dcfce7; color: #166534; }
.urg-warning { background: #fed7aa; color: #9a3412; }
.urg-overdue { background: #fecaca; color: #991b1b; }
.urg-done { background: #e2e8f0; color: #475569; }

.feed-body { padding: 16px; }
.feed-body .city { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
.feed-body .addr { font-size: 16px; font-weight: 700; margin: 4px 0 8px; }
.feed-body .manuf { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.feed-body .text { 
    font-size: 14px; 
    line-height: 1.5; 
    padding: 10px; 
    background: #fff; 
    border-left: 3px solid var(--primary); 
    border-radius: 6px;
    white-space: pre-wrap;
}
.close-reason { 
    display: inline-block; 
    margin-top: 10px; 
    padding: 4px 10px; 
    background: #fef3c7; 
    color: #92400e; 
    border-radius: 6px; 
    font-size: 12px; 
    font-weight: 600; 
}
.feed-meta { 
    font-size: 12px; 
    color: var(--muted); 
    margin-top: 10px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

/* Комментарии директора */
.director-comments { 
    margin-top: 16px; 
    padding-top: 12px; 
    border-top: 1px dashed var(--border);
}
.director-comments h4 { 
    font-size: 12px; 
    color: var(--muted); 
    text-transform: uppercase; 
    margin: 0 0 8px 0;
    font-weight: 700;
}
.dc-item { 
    background: #fef3c7; 
    border-left: 3px solid #f59e0b; 
    padding: 10px 12px; 
    border-radius: 6px; 
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.4;
}
.dc-item .dc-author { font-weight: 700; color: #92400e; font-size: 11px; }
.dc-item .dc-time { font-size: 10px; color: #a16207; margin-left: 8px; }
.dc-item .dc-text { margin-top: 4px; white-space: pre-wrap; }

/* Форма комментария */
.director-input { 
    margin-top: 12px; 
    display: flex; 
    gap: 8px; 
    align-items: flex-end;
}
.director-input textarea { 
    flex: 1; 
    min-height: 40px; 
    max-height: 100px; 
    margin: 0; 
    padding: 8px 12px; 
    font-size: 13px;
    border: 1px solid #fbbf24;
    border-radius: 8px;
}
.director-input .btn { 
    width: auto; 
    margin: 0; 
    padding: 10px 16px; 
    height: 40px; 
    background: #f59e0b;
    color: #fff;
}
.director-input .btn:hover { background: #d97706; }
</style>
</head><body>
<header class="topbar">
  <h1>АЛЬБИОН · <span class="role-tag" id="roleTag">Директор</span></h1>
  <div class="right">
    <a href="/tasks" class="btn ghost">Задания</a>
    <a href="/client" class="btn ghost">Мониторинг</a>
    <span id="whoami" style="font-size:12px;opacity:0.9"></span>
    <button class="btn ghost" id="logout">Выйти</button>
  </div>
</header>

<div class="container wide">
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px" id="typeFilter">
    <button class="btn ghost chip active" data-type="all" style="color:var(--ink);border-color:var(--border)">Все</button>
    <button class="btn ghost chip" data-type="task" style="color:var(--ink);border-color:var(--border)">📋 Задания</button>
    <button class="btn ghost chip" data-type="monitoring" style="color:var(--ink);border-color:var(--border)">📷 Мониторинг</button>
  </div>
  
  <div id="feed"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/director.js"></script>
</body></html>
