services:
  app:
    build: .
    container_name: albion_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/monitoring.db
      - UPLOADS_DIR=/uploads
    volumes:
      # Данные вне контейнера — не пропадут при пересборке
      - ../data:/data
      - ../uploads:/uploads
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
