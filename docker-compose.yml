services:
  app:
    build: .
    container_name: albion_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/monitoring.db
      - UPLOADS_DIR=/uploads
    volumes:
      # Данные вне контейнера — не пропадут при пересборке
      - ../data:/data
      - ../uploads:/uploads
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
