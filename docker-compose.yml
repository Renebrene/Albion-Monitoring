services:
  app:
    build: .
    container_name: albion_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in app/.env before starting}
      DB_PATH: /data/monitoring.db
      UPLOADS_DIR: /uploads
    volumes:
      # Данные вне контейнера — не пропадут при пересборке
      - ../data:/data
      - ../uploads:/uploads
      # Опционально: добавить отдельный read-write bind mount для PRIVATE_MEDIA_DIR,
      # но только для каталога вне публичного Albion Files uploads/ и после
      # ручной настройки минимальных прав Linux service user/group.
    ports:
      # Publish only on loopback; Nginx/Caddy terminates TLS and proxies here.
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
